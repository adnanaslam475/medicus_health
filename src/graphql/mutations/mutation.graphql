mutation createUser($input: CreateUserInput!) {
  createUser(createUserInput: $input) {
    id
    email
  }
}

mutation CreatePatientHealthHistory($input: CreatePatientHealthHistoryInput!) {
  createPatientHealthHistory(createPatientHealthHistoryInput: $input) {
    id
  }
}

mutation UpdatePatientHealthHistory($input: UpdatePatientHealthHistoryInput!) {
  updatePatientHealthHistory(updatePatientHealthHistoryInput: $input) {
    id
  }
}

mutation userVerifyEmail($input: String!) {
  userVerifyEmail(token: $input) {
    id
  }
}

mutation login($input: LoginUserInput!) {
  login(loginUserInput: $input) {
    access_token
    user {
      id
      email
      role
      first_name
      last_name
      doctorId
      patientProfile {
        profileImage
      }
      doctorProfile {
        profile_image
        specialization
      }
      adminProfilePicture {
        profile_picture
      }
      timeZone {
        countryName
        countryCode
        timeZone
        id
        gmtOffset
      }
    }
  }
}

mutation UserForgotPassword($input: String!) {
  UserForgotPassword(email: $input) {
    id
  }
}

mutation UserResetPassword($input: ResetPasswordInput!) {
  UserResetPassword(resetPasswordInput: $input) {
    id
  }
}

# SET ADMIN PHYSICIAN PASSWORD
mutation setDoctorPassword($setPasswordInput: ResetPasswordInput!) {
  setDoctorPassword(setPasswordInput: $setPasswordInput) {
    id
  }
}

# CREATE CARD MUTATION
mutation createCard($input: CreatePaymentInput!) {
  createCard(createPaymentInput: $input) {
    id
    user_id
    card_id
    card_type
    card_digits
    is_default
    exp_month
    exp_year
    card_holder_name
  }
}

# REMOVE CARD MUTATION
mutation removeCard($input: Int!) {
  removeCard(id: $input) {
    id
    user_id
    card_id
    card_type
    card_digits
    is_default
  }
}

# DEFAULT CARD SET
mutation DefaultCard($input: Int!) {
  setAsDefaultCard(id: $input) {
    id
    user_id
    card_id
    card_type
    card_digits
    is_default
  }
}
#REMOVE Staff

mutation removeStaff($id: Int!) {
  removeStaff(id: $id) {
    id
    first_name
    last_name
    email
    contact_number
  }
}

# UPDATE USER MUTATION
mutation updateUserProfile($id: Int!, $updateUserInput: UpdateUserInput!) {
  updateUser(id: $id, updateUserInput: $updateUserInput) {
    first_name
    last_name
    email
    gender
    date_of_birth
    country_id
    contact_number
    city_id
    password
    state_id
    role
    zip_code
    streetAddress
  }
}

# CREATE DOCTOR MUTATION
mutation createDoctor($createDoctorInput: CreateDoctorInput!) {
  createDoctor(createDoctorInput: $createDoctorInput) {
    first_name
    last_name
    email
    streetAddress
    country_id
    state_id
    city_id
    zip_code
    # specialization
    id
  }
}

# DOCTOR UPDATE MUTATION
mutation updateDoctorProfile(
  $updateDoctorProfileInput: UpdateDoctorProfileInput!
) {
  updateDoctorProfile(updateDoctorProfileInput: $updateDoctorProfileInput) {
    id
    doctor_id
    year_of_experience
    specialization
    condition_treated
    educational_background
    professional_experience
    certification_and_licensure
    awards_honors_recognition
    language
    about_me
    profile_image
    user {
      id
      first_name
      last_name
      email
      gender
      streetAddress
      contact_number
      country_id
      state_id
      city_id
      contact_number
      timeZoneId
      city {
        city_name
      }
      state {
        state_name
      }
      country {
        country_name
      }
      zip_code
      password
      status
      role
    }
  }
}

#ENABLE OR DISABLE DOCTOR
mutation enableOrDisableDoctor($id: Int!, $activeStatus: Boolean) {
  enableOrDisableDoctor(id: $id, activeStatus: $activeStatus) {
    id
    status
    is_active
  }
}

