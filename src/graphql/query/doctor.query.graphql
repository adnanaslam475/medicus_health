query doctorBillingMethods($doctorId: Int!) {
  doctorBillingMethods(doctorId: $doctorId) {
    id
    bankId
    bankName
    bankAccountNumber
    accountTitle
    routingNumber
  }
}

query doctorAppointmentDetail($id: Int!) {
  appointment(id: $id) {
    id
    status
    scheduleId
    doctorId
    patientId
    requestedDate
    createdAt
    reportUrl
    doctor {
      id
      first_name
      last_name
    }
    patient {
      id
      first_name
      last_name
    }
    appointmentTimeSlots {
      id
      startTime
      endTime
      selected
    }
    serviceType {
      id
      name
      price
    }
    transaction {
      createdAt
    }
    appointmentHealthHistory {
      history
    }
  }
}

query doctorAppointmentDetailAppointmentInfo($id: Int!) {
  appointment(id: $id) {
    id
    status
    requestedDate
    createdAt
    charges
    patient {
      first_name
      last_name
    }
    serviceType {
      id
      name
      price
    }
    appointmentTimeSlots {
      id
      startTime
      endTime
      selected
    }
    appointmentSchedule {
      startTime
      endTime
    }
  }
}

query doctorAppointmentDetailPatientInfo($id: Int!) {
  appointment(id: $id) {
    serviceType {
      name
    }
    patient {
      id
      first_name
      last_name
      email
      gender
      date_of_birth
      contact_number
      contact_number
      streetAddress
      country_id
      city_id
      patientProfile {
        id
        maritalStatus
        children
        occupation
        occupationalExposure
        pets
      }
    }
  }
}

query physicianAppointments($filter: GetPhysicianAppointmentInput!) {
  physicianAppointments(filter: $filter) {
    id
    patient {
      first_name
      last_name
    }
    serviceType {
      name
    }
    appointmentTimeSlots {
      startTime
      endTime
      selected
    }
    createdAt
    requestedDate
    charges
    status
  }
}

query physicianAppointmentsHistory($filter: GetAppointmentInput!) {
  appointments(filter: $filter) {
    id
    patientId
    createdAt
    requestedDate
    serviceType {
      name
    }
    patient {
      first_name
      last_name
      gender
      email
      date_of_birth
      contact_number
      country_id
      city_id
      patientProfile {
        maritalStatus
        children
        occupation
        occupationalExposure
        pets
      }
      patientHealthHistory {
        history
      }
    }
    doctor {
      first_name
      last_name
    }
    charges
    appointmentHealthHistory {
      history
    }
    reportUrl
    appointmentTimeSlots {
      startTime
      endTime
      selected
    }
     doctor{
      first_name
      last_name
    }
    doctorNote {
      subjective
      objective
      assessment
      plan
    }
    status
    transaction {
      status
      amountReceived
    }
    charges
  }
}

#Get My Earnings Of Doctor
query getTransectionFilter($filter: GetTransectionInput!) {
  getTransectionFilter(filter: $filter) {
    id
    appointmentId
    transactionId
    payment_status
    amountReceived
    appointment {
      patient {
        first_name
        last_name
      }
      patientId
      serviceType {
        id
        name
      }
      appointmentTimeSlots {
        selected
        startTime
        endTime
      }
    }
  }
}

query physiciansPatients($searchField: String) {
  physiciansPatients(filter: { searchField: $searchField }) {
    id
    first_name
    last_name
    email
    contact_number
    streetAddress
    country{
      country_name
    }
    patientProfile {
      profileImage
    }
  }
}
