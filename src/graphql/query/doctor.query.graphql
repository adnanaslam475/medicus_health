query physicianAppointmentsHistory(
  $filter: GetAppointmentInput!
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  appointments(filter: $filter, pagination: $pagination, sorting: $sorting) {
    items {
      id
      doctorId
      charges
      serviceId
      patientId
      createdAt
      reportUrl
      requestedDate
      serviceType {
        name
      }
      patient {
        first_name
        last_name
        gender
        email
        date_of_birth
        contact_number
        country_id
        city_id
        patientProfile {
          maritalStatus
          children
          occupation
          occupationalExposure
          pets
        }
        patientHealthHistory {
          history
        }
      }
      charges
      appointmentHealthHistory {
        history
      }
      reportUrl
      appointmentTimeSlots {
        startTime
        endTime
        selected
      }
      appointmentDateTime {
        startTime
        endTime
      }
      doctor {
        first_name
        last_name
        doctorProfile {
          id
          doctor_id
          year_of_experience
          specialization
          condition_treated
          educational_background
          professional_experience
          language
          about_me
          profile_image
          user {
            id
            first_name
            last_name
            email
            gender
            country_id
            state_id
            city_id
            zip_code
            password
            status
            role
            doctorSchedules {
              id
              doctorId
              day
              startTime
              endTime
              createdAt
              updatedAt
            }
          }
        }
      }
      status
      transaction {
        status
        amountReceived
      }
      charges
    }
    meta {
      totalPages
      currentPage
    }
  }
}

#Get My Earnings Of Doctor
query getTransactionFilter(
  $filter: GetTransectionInput!
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  getTransactionFilter(
    filter: $filter
    pagination: $pagination
    sorting: $sorting
  ) {
    items {
      id
      appointmentId
      transactionId
      payment_status
      amountReceived
      status
      stripeFee
      doctor_percentage
      payment_status
      createdAt
      appointmentCharges
      stripeFee
      tax
      appointment {
        status
        patient {
          first_name
          last_name
        }
        patientId
        serviceType {
          id
          name
        }
        appointmentTimeSlots {
          selected
          startTime
          endTime
        }
      }
    }
    meta {
      totalPages
      currentPage
    }
  }
}

query physiciansPatients(
  $searchField: String
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  physiciansPatients(
    filter: { searchField: $searchField }
    pagination: $pagination
    sorting: $sorting
  ) {
    items {
      id
      first_name
      last_name
      email
      contact_number
      streetAddress
      country {
        country_name
      }
      patientProfile {
        profileImage
      }
    }
    meta {
      totalPages
      currentPage
    }
  }
}

query getPhysicians(
  $filter: GetPhysiciansInput!
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  getPhysicians(filter: $filter, pagination: $pagination, sorting: $sorting) {
    items {
      id
      first_name
      last_name
      email
      streetAddress
      createdAt
      city {
        city_name
      }
      state {
        state_name
      }
      country {
        country_name
      }
      zip_code
      doctorProfile {
        language
        specialization
      }
    }
    meta {
      totalPages
      currentPage
    }
  }
}

# GET APPOINTMENT NOTES BY ID
# =============

query getAppointmentNoteById($appointmentId: Int!) {
  appointmentNote(appointmentId: $appointmentId) {
    id
    appointmentId
    subjective
    objective
    assessment
    plan
    note
    isPublished
    createdAt
    updatedAt
    appointment {
      id
      patientId
      doctorId
      doctor {
        id
        first_name
        last_name
      }
    }
  }
}

# GET ALL APPOINTMENT NOTES BY ID
# =============

query getAllAppointmentNotes {
  appointmentNotes {
    id
    appointmentId
    subjective
    objective
    assessment
    plan
    note
    isPublished
    createdAt
    updatedAt
    appointment {
      id
      patientId
      doctorId
    }
  }
}

query doctorPayouts($doctorId: Int!) {
  doctorPayouts(doctorId: $doctorId) {
    appointmentMonths
    monthAppointments {
      id
      doctorId
      patientId
      patient {
        first_name
        last_name
      }
      serviceType {
        name
      }
      appointmentDateTime {
        startTime
        endTime
      }

      transaction {
        transactionId
        appointmentId
        id
        doctor_percentage
      }
    }
  }
}

query doctorSchedulesByDay(
  $doctorId: Int!
  $filter: GetDoctorScheduleFilterInput!
) {
  doctorSchedulesByDay(doctorId: $doctorId, filter: $filter) {
    id
    day
    startTime
    endTime
  }
}
