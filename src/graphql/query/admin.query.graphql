query adminUser($id: Int!) {
  adminUser(id: $id) {
    id
    first_name
    last_name
    email
    contact_number

    adminProfilePicture {
      profile_picture
    }
  }
}

# remove admin user
mutation removeAdminUser($id: Int!) {
  removeUser(id: $id) {
    id
  }
}
