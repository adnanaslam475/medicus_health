    createdAt
    requestedDate
    serviceType {
      name
    }
    patient {
      first_name
      last_name
      gender
      email
      date_of_birth
      contact_number
      country_id
      city_id
      patientProfile {
        maritalStatus
        children
        occupation
        occupationalExposure
        pets
      }
      patientHealthHistory {
        history
      }
    }
    doctor {
      first_name
      last_name
    }
    charges
    appointmentHealthHistory {
      history
    }
    reportUrl
    appointmentTimeSlots {
      startTime
      endTime
      selected
    }
    appointmentDateTime {
      startTime
      endTime
    }
    doctor {
