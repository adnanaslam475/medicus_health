overwrite: true
schema: "https://dev-api.joinmedicus.com/graphql"
documents: "src/**/*.graphql"
generates:
  src/generated/graphql.tsx:
    config:
      withHooks: true
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-urql"
      - "urql-introspection"
  ./graphql.schema.json:
    plugins:
      - "introspection"
# http://localhost:3000/graphql
# https://medicus-api-dev.agencypartner.com/graphql
