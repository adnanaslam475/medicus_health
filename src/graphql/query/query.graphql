query countries {
  countries {
    id
    country_name
  }
}

query getStatesByCountry($input: Int!) {
  getStatesByCountry(country_id: $input) {
    id
    country_id
    state_name
  }
}

query getCitiesByState($input: Int!) {
  getCitiesByState(state_id: $input) {
    id
    state_id
    city_name
  }
}


query doctorProfiles {
    doctorProfiles {
      id
      doctor_id
      year_of_experience
      specialization
      condition_treated
      educational_background
      professional_experience
      language
      about_me
      user {
        id
        first_name
        last_name
        email
        gender
        contact_number
      }
    }
}

