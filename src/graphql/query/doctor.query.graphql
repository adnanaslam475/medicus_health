        id
        doctor_id
        year_of_experience
        specialization
        condition_treated
        educational_background
        professional_experience
        language
        about_me
        profile_image
        user {
          id
          first_name
          last_name
          email
          gender
          country_id
          state_id
          city_id
          zip_code
          password
          status
          role
          doctorSchedules {
            id
            doctorId
            day
            startTime
            endTime
            createdAt
            updatedAt
          }
        }
      }
    }

    # currentAppointmentNote {
    #   id
    #   subjective
    #   objective
    #   assessment
    #   plan
    #   note
    #   isPublished
    # }
    # notesHistory {
    #   id
