query doctorBillingMethods($doctorId: Int!) {
  doctorBillingMethods(doctorId: $doctorId) {
    id
    bankId
    bankName
    bankAccountNumber
    accountTitle
    routingNumber
  }
}

query doctorAppointmentDetail($id: Int!) {
  appointment(id: $id) {
    id
    status
    scheduleId
    doctorId
    patientId
    requestedDate
    createdAt
    reportUrl
    doctor {
      id
      first_name
      last_name
    }
    patient {
      id
      first_name
      last_name
    }
    appointmentTimeSlots {
      id
      startTime
      endTime
      selected
    }
    appointmentDateTime {
      startTime
      endTime
    }
    serviceType {
      id
      name
      price
    }
    transaction {
      createdAt
    }
    appointmentHealthHistory {
      history
    }
  }
}

query doctorAppointmentDetailAppointmentInfo($id: Int!) {
  appointment(id: $id) {
    id
    status
    requestedDate
    createdAt
    charges
    patient {
      id
      first_name
      last_name
      patientProfile {
        profileImage
      }
    }
    serviceType {
      id
      name
      price
    }
    appointmentTimeSlots {
      id
      startTime
      endTime
      selected
    }
    appointmentDateTime {
      startTime
      endTime
    }
    appointmentSchedule {
      startTime
      endTime
    }
    transaction {
      status
      amountReceived
    }
  }
}

query doctorAppointmentDetailPatientInfo($id: Int!) {
  appointment(id: $id) {
    serviceType {
      name
    }
    patient {
      id
      first_name
      last_name
      email
      gender
      date_of_birth
      contact_number
      contact_number
      streetAddress
      country_id
      city_id
      patientProfile {
        id
        maritalStatus
        children
        occupation
        occupationalExposure
        pets
        profileImage
      }
    }
  }
}

query physicianAppointments(
  $filter: GetPhysicianAppointmentInput!
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  physicianAppointments(
    filter: $filter
    pagination: $pagination
    sorting: $sorting
  ) {
    items {
      id
      patient {
        first_name
        last_name
      }
      serviceType {
        name
      }
      appointmentTimeSlots {
        startTime
        endTime
        selected
      }
      appointmentDateTime {
        startTime
        endTime
      }
      createdAt
      requestedDate
      charges
      status
      transaction {
        payment_status
        status
        amountReceived
      }
    }
    meta {
      totalPages
      currentPage
    }
  }
}

