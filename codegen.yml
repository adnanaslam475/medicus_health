overwrite: true
schema: "http://localhost:3000/graphql"
documents: "src/**/*.graphql"
generates:
  src/generated/graphql.tsx:
    config:
      withHooks: true
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-urql"
      - "urql-introspection"
  ./graphql.schema.json:
    plugins:
      - "introspection"
