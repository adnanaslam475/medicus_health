    #   objective
    #   assessment
    #   plan
    #   note
    #   isPublished
    # }

    currentAppointmentNote {
      appointment {
        id
        doctor {
          id
          first_name
          last_name
        }
      }
      createdAt
      id
      subjective
      objective
      assessment
      plan
      note
      isPublished
    }
    notesHistory {
      appointment {
        id
        doctor {
          id
          first_name
          last_name
        }
      }
      createdAt
      id
      subjective
      objective
      assessment
      plan
      note
      isPublished
    }
