mutation createDoctorSchedule(
  $doctorId: Int!
  $day: Int!
  $startTime: String!
  $endTime: String!
) {
  createDoctorSchedule(
    createDoctorScheduleNewInput: {
      doctorId: $doctorId
      day: $day
      startTime: $startTime
      endTime: $endTime
    }
  ) {
    id
    startTime
    endTime
    day
  }
}

mutation removeDoctorSchedule($id: Int!) {
  removeOneDoctorSchedule(id: $id) {
    day
  }
}