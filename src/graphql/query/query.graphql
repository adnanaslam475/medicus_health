query doctorProfile($doctor_id: Int!) {
  doctorProfile(doctor_id: $doctor_id) {
    id
    doctor_id
    year_of_experience
    specialization
    condition_treated
    educational_background
    professional_experience
    language
    about_me
    profile_image
    user {
      id
      first_name
      last_name
      email
      gender
      country_id
      state_id
      city_id
      zip_code
      password
      status
      role
      doctorSchedules {
        id
        doctorId
        day
        startTime
        endTime
        createdAt
        updatedAt
      }
    }
  }
}

# get all appointments
query getAllRequestedAppointments($filter: GetAppointmentInput!) {
  appointments(filter: $filter) {
    id
    patientId
    doctorId
    serviceId
    requestedDate
    status
    charges
    patient {
      first_name
      last_name
    }
    serviceType {
      name
      price
    }
    doctor {
      first_name
      last_name
    }
    appointmentTimeSlots {
      id
      startTime
      endTime
      selected
    }
    transaction {
      createdAt
      amountReceived
    }
  }
}
