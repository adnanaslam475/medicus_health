# GET DOCTOR PROFILE DETAILS
query doctorProfileDetails($input: Int!) {
  user(id: $input) {
    id
    first_name
    last_name
    email
    streetAddress
    country_id
    state_id
    city_id
    zip_code

    doctorProfile {
      id
      year_of_experience
      specialization
      condition_treated
      educational_background
      professional_experience
      language
      about_me
      profile_image
    }
    doctorSchedules {
      day
      startTime
      endTime
    }
  }
}

#GET APPOINMENT SERVICE TYPES
query getAllAppointmentServiceTypes {
  appointmentServiceTypes {
    id
    name
    price
  }
}

#GET DOCTOR SCHEDULES
query doctorSchedules($doctorId: Int!) {
  doctorSchedules(doctorId: $doctorId) {
    id
    doctorId
    day
    startTime
    endTime
  }
}

#GET DOCTOR QUESTIONAIRES
query doctorQuestionnaire($doctorId: Int!) {
  doctorQuestionnaire(doctorId: $doctorId) {
    id
    doctorId
    questionnaire
  }
}

#GET APPOINMENT BY ID
query getAppointmentById($id: Int!) {
  appointment(id: $id) {
    id
    status
    scheduleId
    doctorId
    patientId
    requestedDate
    reportUrl
    doctor {
      id
      first_name
      last_name
    }
    patient {
      id
      first_name
      last_name
    }
    appointmentTimeSlots {
      id
      startTime
      endTime
      selected
    }
    appointmentSchedule {
      id
      day
      doctorId
      startTime
      endTime
    }
    serviceType {
      id
      name
      price
    }
    transaction {
      createdAt
    }
    appointmentHealthHistory {
      history
    }
  }
}

# GET ALL TRANSACTIONS
query getAllTransactions {
  transactions {
    id
    transactionId
    appointmentId
    amountReceived
    status
    createdAt
    appointment {
      requestedDate
      reportUrl
      doctor {
        first_name
        last_name
      }
      patient {
        first_name
        last_name
      }
      serviceType {
        id
        name
      }
      appointmentTimeSlots {
        selected
        startTime
        endTime
      }
    }
  }
}

# Get Doctor Schedules
query schedule($doctorId: Int!) {
  doctorSchedules(doctorId: $doctorId) {
    id
    startTime
    endTime
    day
  }
}

