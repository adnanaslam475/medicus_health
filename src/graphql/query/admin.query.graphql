      appointmentTypeProposed {
        type
      }
      appointmentDateTime {
        startTime
      }
      appointmentCharges {
        appointmentPrice
        tax
        systemFee
        total
      }
      patient {
        first_name
        last_name
      }
      transaction {
        id
        createdAt
        transactionId
        tax
        doctor_percentage
        medicus_percentage
        stripeFee
        amountReceived
