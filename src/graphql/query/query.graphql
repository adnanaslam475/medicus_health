query doctorProfile($doctor_id: Int!) {
  doctorProfile(doctor_id: $doctor_id) {
    id
    doctor_id
    year_of_experience
    specialization
    condition_treated
    educational_background
    professional_experience
    awards_honors_recognition
    certification_and_licensure
    language
    about_me
    profile_image
    user {
      id
      first_name
      last_name
      email
      gender
      streetAddress
      country_id
      state_id
      city_id
      country {
        country_name
      }
      state {
        state_name
      }
      city {
        city_name
      }
      zip_code
      password
      status
      role
      contact_number
      doctorSchedules {
        id
        doctorId
        day
        startTime
        endTime
        createdAt
        updatedAt
      }
    }
  }
}

# get all appointments
query getAllRequestedAppointments(
  $filter: GetAppointmentInput!
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  appointments(filter: $filter, pagination: $pagination, sorting: $sorting) {
    items {
      id
      patientId
      doctorId
      serviceId
      requestedDate
      reportUrl
      createdAt
      status
      charges
      patient {
        first_name
        last_name
      }
      serviceType {
        name
        price
      }
      doctor {
        first_name
        last_name
        doctorProfile {
          id
          doctor_id
          year_of_experience
          specialization
          condition_treated
          educational_background
          professional_experience
          language
          about_me
          profile_image
          user {
            doctorId
            id
            first_name
            last_name
            email
            gender
            country_id
            state_id
            city_id
            zip_code
            password
            status
            role
            doctorSchedules {
              id
              doctorId
              day
              startTime
              endTime
              createdAt
              updatedAt
            }
          }
        }
      }
      appointmentTimeSlots {
        id
        startTime
        endTime
        selected
      }
      transaction {
        createdAt
        status
        amountReceived
      }
      appointmentSchedule {
        startTime
        endTime
      }
      appointmentDateTime {
        startTime
        endTime
      }
    }
    meta {
      totalPages
      currentPage
    }
  }
}

