# GET ALL TRANSACTIONS
query getAllTransactions(
  $pagination: PaginationParams
  $sorting: SortingParams
) {
  transactions(pagination: $pagination, sorting: $sorting) {
    items {
      id
      transactionId
      appointmentId
      amountReceived
      status
      createdAt
      appointment {
        requestedDate
        reportUrl
        doctor {
          first_name
          last_name
        }
        patient {
          first_name
          last_name
        }
        serviceType {
          id
          name
        }
        appointmentTimeSlots {
          selected
          startTime
          endTime
        }
      }
    }
    meta {
      totalPages
      currentPage
    }
  }
}

