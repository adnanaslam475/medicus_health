#Get My Earnings Of Doctor
query getTransectionFilter($filter: GetTransectionInput!) {
  getTransectionFilter(filter: $filter) {
    id
    appointmentId
    transactionId
    payment_status
    amountReceived
    appointment {
      patient {
        first_name
        last_name
      }
      patientId
      serviceType {
        id
        name
      }
      appointmentTimeSlots {
        selected
        startTime
        endTime
      }
    }
  }
}

query physiciansPatients($searchField: String) {
  physiciansPatients(filter: { searchField: $searchField }) {
    id
    first_name
    last_name
    email
    contact_number
    streetAddress
    country {
      country_name
    }
    patientProfile {
      profileImage
    }
  }
}

query getPhysicians($filter: GetPhysiciansInput!) {
  getPhysicians(filter: $filter) {
    id
    first_name
    last_name
    email
    streetAddress
    createdAt
    city {
      city_name
    }
    state {
      state_name
    }
    country {
      country_name
    }
    zip_code
    doctorProfile {
      language
      specialization
    }
  }
}

# GET APPOINTMENT NOTES BY ID
# =============

query getAppointmentNoteById($appointmentId: Int!) {
  appointmentNote(appointmentId: $appointmentId) {
    id
    appointmentId
    subjective
    objective
    assessment
    plan
    note
    isPublished
    createdAt
    updatedAt
    appointment {
      id
      patientId
      doctorId
      doctor {
        id
        first_name
        last_name
      }
    }
  }
}

# GET ALL APPOINTMENT NOTES BY ID
# =============

query getAllAppointmentNotes {
  appointmentNotes {
    id
    appointmentId
    subjective
    objective
    assessment
    plan
    note
    isPublished
    createdAt
    updatedAt
    appointment {
      id
      patientId
      doctorId
    }
  }
}
